version: '3.8'

services:
  # Production service
  cars-game-prod:
    build:
      context: ..
      target: production
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=Cars Racing Game (Production)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "description=Production server with health checks"
      - "service=cars-game" 